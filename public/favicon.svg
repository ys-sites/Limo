<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Luxury dark rounded badge backplate for browser tab readability -->
  <rect width="64" height="64" rx="16" fill="#07080A"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#goldGradient)" stroke-width="1.5" stroke-opacity="0.8"/>

  <g transform="translate(6, 6)">
    <!-- Royal Laurel / Crown Arch Accent -->
    <path d="M26 4 L28 9 L33 7 L30 12 L35 15 L29 16 L26 21 L23 16 L17 15 L22 12 L19 7 L24 9 Z" fill="url(#goldGradient)"/>

    <!-- Central Majestic 'LR' Monogram Emblem matching Limo Raf Logo -->
    <text x="26" y="36" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="19" font-weight="900" text-anchor="middle" fill="url(#goldGradient)" letter-spacing="1.5">
      LR
    </text>

    <!-- Luxury Underline Ribbon Bar -->
    <path d="M12 40 L40 40" stroke="url(#goldGradient)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="26" cy="40" r="2.2" fill="#FFF3C4"/>

    <!-- Sub-text 'LIMO RAF' -->
    <text x="26" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="800" text-anchor="middle" fill="#F5D577" letter-spacing="2.2">
      LIMO RAF
    </text>
  </g>

  <!-- Luminous Gold Shimmer Gradient -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="25%" stop-color="#F5D577"/>
      <stop offset="65%" stop-color="#D7B65D"/>
      <stop offset="100%" stop-color="#9C7420"/>
    </linearGradient>
  </defs>
</svg>
